<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleHub - Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Header -->
    <header>
        <h1>👗 StyleHub</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart 🛒</a>
            <a href="login.html">Login</a>
        </nav>
    </header>
    <!-- Sign Up Section -->
    <section class="signup-container">
        <div class="signup-box">
            <h2>Create Your Account</h2>
            <p>Join StyleHub and explore the latest fashion trends!</p>
            <form id="register-form" onsubmit="registerUser(event)">
                <label for="fullname">Full Name</label>
                <input type="text" id="register-name" name="fullname" placeholder="Enter your full name" required>
                <label for="email">Email Address</label>
                <input type="email" id="register-email" name="email" placeholder="Enter your email" required>
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                <label for="password">Password</label>
                <input type="password" id="register-password" name="password" placeholder="Create a password" minlength="6" required>
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" minlength="6" required>
                <label class="terms">
                    <input type="checkbox" required>
                    I agree to the Terms & Conditions
                </label>
                <button type="submit">Create Account</button>
            </form>
            <p class="login-link">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>
        </div>
    </section>
    <!-- Footer -->
    <footer>
        <p>© 2026 StyleHub - Fashion & Apparel</p>
    </footer>
</body>
</html>
