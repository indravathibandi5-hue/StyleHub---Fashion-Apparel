<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Checkout - StyleHub</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<header>
    <h1>👗 StyleHub</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="cart.html">Cart</a>
        <a href="account.html">Account</a>
    </nav>
</header>
<h2>Checkout</h2>
<form id="checkout-form">
    <!-- Delivery Address -->
    <section id=""delivery-option>
        <h3>Delivery Address</h3>
        <label>Full Name:</label><br>
        <input type="text" id="full-name" name="fullname" placeholder="Enter your name" required>
        <br><br>
        <label>Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>
        <br><br>
        <label>Address:</label><br>
        <textarea id="address" name="address" rows="4" placeholder="House number, street, area" required></textarea>   
        <br><br>
        <label for="city">City:</label><br>
        <input type="text" id="city" name="city" placeholder="Enter city" required>
        <br><br>
        <label for="pin">PIN Code:</label><br>
        <input type="text" id="pin" name="pin" placeholder="Enter PIN code" required>
    </section>
    <!-- Payment -->
    <section>
        <h3>Payment Method</h3>
        <input type="radio" name="payment" value="upi" checked>
        <label>UPI</label>
        <br>
        <input type="radio" name="payment" value="card">
        <label>Credit / Debit Card</label>
        <br>
        <input type="radio" name="payment" value="cod">
        <label>Cash on Delivery</label>
    </section>
    <!-- Delivery Options -->
    <section>
        <h3>Delivery Options</h3>
        <select>
            <option>
                Standard Delivery (3-5 Days)
            </option>
            <option>
                Express Delivery (1-2 Days)
            </option>
            <option>
                Same Day Delivery
            </option>
            <option>
                Pickup from Store
            </option>
            <option>
                Drone Delivery (Available in select areas)
            </option>
            <option>
                Scheduled Delivery (Choose a specific date and time)
            </option>
        </select>
    </section>
    <!-- Order Summary -->
    <section id="order-summary">
        <h3>Order Summary</Summary></h3>
    </section>
</form>
</body>
</html>
