<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleHub - My Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <h1>👗 StyleHub</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart 🛒</a>
            <a href="profile.html">Profile</a>
        </nav>
    </header>
    <!-- Profile Section -->
    <main class="profile-container">
        <div class="profile-box">
            <!-- Profile Image -->
            <div class="profile-image">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=500&q=80" alt="Profile Picture">
            </div>
            <h2>My Profile</h2>
            <p class="welcome">Welcome back to StyleHub!</p>
            <!-- Profile Information -->
            <div class="profile-info">
                <div class="info-item">
                    <label>Full Name</label>
                    <p>John</p>
                </div>

                <div class="info-item">
                    <label>Email Address</label>
                    <p>john@example.com</p>
                </div>
                <div class="info-item">
                    <label>Phone Number</label>
                    <p>9876543210</p>
                </div>
                <div class="info-item">
                    <label>Address</label>
                    <p>Pileru, Andhra Pradesh, India</p>
                </div>
            </div>
            <!-- Profile Actions -->
            <div class="profile-actions">
                <a href="edit-profile.html" class="btn">Edit Profile</a>
                <a href="orders.html" class="btn">Order History</a>
                <a href="wishlist.html" class="btn">Wishlist ❤️</a>
                <a href="login.html" class="logout-btn">Logout</a>
            </div>
        </div>
    </main>
    <!-- Footer -->
    <footer>
        <p>© 2026 StyleHub - Fashion & Apparel</p>
    </footer>
</body>
</html>
